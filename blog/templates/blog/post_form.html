{% extends "blog/base.html" %}
{% load crispy_forms_tags %}
{% block content %}
    <div class="content-section">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <fieldset class="form-group">
                <legend class="border-bottom mb-4">Create/Update Agent</legend>
                {{ form|crispy }}
                <small>(API use llama-3.3-70b-versatile, LOCAL use qwen2.5:0.5b)</small>
            </fieldset>
            <div class="form-group">
                <button class="btn btn-outline-info" type="submit">Send</button>
            </div>
        </form>
    </div>
{% endblock content %}
<!--enctype="multipart/form-data"> obliger pour gerer l'update de l'image-->
